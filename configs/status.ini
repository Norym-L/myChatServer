; StatusServer 专用配置
; 启动：StatusServer.exe --config=status.ini

; 监听地址，GateServer / ChatServer 通过 [StatusServerForClient] 连接这里
[StatusServer]
host = 0.0.0.0
port = 50052

; StatusServer 需要知道全部 ChatServer 才能按连接数最少分发，这里保留完整列表
[ChatServer]
servers = ChatServer1,ChatServer2

[ChatServer1]
host = 127.0.0.1
port = 8090
name = ChatServer1

[ChatServer2]
host = 127.0.0.1
port = 8091
name = ChatServer2

; StatusServer 自身也要访问 Redis：token 写入（GetChatServer）与 logincount_ 分发计数
[Redis]
host = 127.0.0.1
port = 6380
passwd = 123456

[LoggerLevel]
default = 1
