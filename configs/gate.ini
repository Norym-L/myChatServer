; GateServer 专用配置
; 启动：GateServer.exe --config=gate.ini

[GateServer]
port = 8080

; 作为 gRPC 客户端连接 VerifyServer
[VerifyServer]
host = 127.0.0.1
port = 50051

; 作为 gRPC 客户端连接 StatusServer
[StatusServerForClient]
host = 127.0.0.1
port = 50052

[Mysql]
host = 127.0.0.1
port = 3308
passwd = 123456

[Redis]
host = 127.0.0.1
port = 6380
passwd = 123456

[LoggerLevel]
default = 1
