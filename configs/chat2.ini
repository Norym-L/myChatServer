; ChatServer 实例 2（chat2）
; 启动：ChatServer.exe --config=chat2.ini
; 约定：本文件内恰好一个 [ChatServerN] 段，进程据此确定自身身份

[ChatServer2]
host = 127.0.0.1
port = 8091
name = ChatServer2

; 作为 gRPC 客户端连接 StatusServer 校验 token
[StatusServerForClient]
host = 127.0.0.1
port = 50052

[Mysql]
host = 127.0.0.1
port = 3308
passwd = 123456

[LoggerLevel]
default = 1

; 对端服务器
[PeerServer]
servers = PeerChatServer1

[PeerChatServer1]
host = 127.0.0.1
port = 8090
name = ChatServer1