syntax = "proto3";

package message;

service VerifyService
{
  rpc GetVerifyCode (GetVerifyReq) returns (GetVerifyRsp) {}
}

message GetVerifyReq
{
  string email = 1;
}

message GetVerifyRsp
{
  int32 error = 1;
  string email = 2;
  string code = 3;
}

service StatusService
{
  rpc GetChatServer (GetChatServerReq) returns (GetChatServerRsp) {}
  rpc Login(LoginReq) returns(LoginRsp);
}

message GetChatServerReq
{
  uint64 uid = 1;
}

message GetChatServerRsp
{
  int32 error = 1;
  string host = 2;
  string port = 3;
  string token = 4;
}

message LoginReq
{
  uint64 uid = 1;
  string token = 2;
}

message LoginRsp
{
  int32 error = 1;
  uint64 uid = 2;
  string token = 3;
}

service ChatService
{
  rpc NotifyAddFriend(AddFriendReq) returns (AddFriendRsp) {}
  rpc ReplyAddFriend(ReplyFriendReq) returns (ReplyFriendRsp) {}
  rpc NotifyChatMessage(NotifyChatMessageReq) returns (NotifyChatMessageRsp) {}
}

// 添加好友
message AddFriendReq
{
  uint64 toUid = 1;
  uint64 addFriendRequestId = 2;
}
// 回包
message AddFriendRsp
{
  int32 error = 1;
}
// 回复好友申请
message ReplyFriendReq
{
  uint64 senderUid = 1;
  uint64 addFriendRequestId = 2;
  int32  state = 3;
}

message ReplyFriendRsp
{
  int32 error = 1;
}

// 聊天信息
message NotifyChatMessageReq
{
  uint64 toUid = 2;
}

message NotifyChatMessageRsp
{
  int32 error = 1;
}
